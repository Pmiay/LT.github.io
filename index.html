<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Admin Panel</title>
    <!-- Tailwind CSS v4 para diseño fluido -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .hidden { display: none !important; }
    </style>
     
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <!-- 1. PANTALLA DE AUTENTICACIÓN -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-900">Configurar Conexión GitHub</h2>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">GitHub Personal Access Token (PAT)</label>
                    <input value="" type="password" id="github-token" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Usuario u Organización</label>
                    <input value="Pmiay" id="github-owner" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="ej. mi-usuario">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre del Repositorio</label>
                    <input value="my.github.io" type="text" id="github-repo" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="ej. mi-base-de-datos">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ruta del Archivo (.json)</label>
                    <input value="products/miyuro.one.giv" type="text" id="github-path" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="data/estructura.json">
                </div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 cursor-pointer">
                    Conectar y Cargar Datos
                </button>
            </form>
        </div>
    </div>

    <!-- 2. PANEL DE ADMINISTRACIÓN PRINCIPAL -->
    <div id="admin-panel" class="hidden min-h-screen flex flex-col">
        <!-- Barra Superior -->
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-900">Dashboard de Administración</h1>
            <div class="flex items-center gap-4">
                <span id="repo-badge" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded"></span>
                <button id="logout-btn" class="text-sm text-red-600 hover:underline cursor-pointer">Cerrar Sesión</button>
            </div>
        </header>

        <!-- Contenido de Control -->
        <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 p-6">
            <!-- Sección Izquierda: Árbol Jerárquico -->
            <div class="bg-white p-6 rounded-xl shadow-sm md:col-span-1 flex flex-col">
                <h3 class="text-lg font-semibold mb-4">Jerarquía Actual</h3>
                <div id="tree-container" class="overflow-y-auto flex-1 border border-gray-200 rounded-lg p-4 bg-gray-50 max-h-[60vh]">
                    <p class="text-gray-400 text-sm italic">Esperando conexión...</p>
                </div>
            </div>

            <!-- Sección Derecha: Espacio de Edición -->
            <div class="bg-white p-6 rounded-xl shadow-sm md:col-span-2 flex flex-col">
                <h3 class="text-lg font-semibold mb-4" id="form-title">Administrar Elemento</h3>
                
                <form id="crud-form" class="space-y-4 flex-1 flex flex-col justify-between">
                    <div class="space-y-4" id="dynamic-fields">
                        <p class="text-gray-500 text-sm">Selecciona un elemento para editarlo o añadir nuevos registros.</p>
                    </div>
                    
                    <div class="pt-4 border-t border-gray-100 flex justify-end gap-2">
                        <button type="button" id="btn-save" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700 shadow-sm cursor-pointer">
                            Guardar Cambios en GitHub
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Los scripts de la Parte 2 y 3 se insertarán inmediatamente abajo -->
            <!-- Parte II -->
<script>
    // Variables de control global
    let currentData = null;
    let fileSha = null; // Requerido por GitHub para actualizar archivos existentes

    // Mapeo de Elementos del DOM
    const authScreen = document.getElementById('auth-screen');
    const adminPanel = document.getElementById('admin-panel');
    const authForm = document.getElementById('auth-form');
    const repoBadge = document.getElementById('repo-badge');
    const logoutBtn = document.getElementById('logout-btn');

    // Comprobación de sesión activa al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('gh_token')) {
            showPanel();
            fetchDataFromGitHub();
        }
    });

    // Manejador del formulario de inicio de sesión
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        sessionStorage.setItem('gh_token', document.getElementById('github-token').value);
        sessionStorage.setItem('gh_owner', document.getElementById('github-owner').value);
        sessionStorage.setItem('gh_repo', document.getElementById('github-repo').value);
        sessionStorage.setItem('gh_path', document.getElementById('github-path').value);
        
        showPanel();
        await fetchDataFromGitHub();
    });

    // Manejador de cierre de sesión
    logoutBtn.addEventListener('click', () => {
        sessionStorage.clear();
        authScreen.classList.remove('hidden');
        adminPanel.classList.add('hidden');
        document.getElementById('tree-container').innerHTML = '<p class="text-gray-400 text-sm italic">Esperando conexión...</p>';
    });

    // Cambiar la vista de la interfaz al panel principal
    function showPanel() {
        authScreen.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        repoBadge.innerText = `${sessionStorage.getItem('gh_owner')}/${sessionStorage.getItem('gh_repo')}`;
    }

    // Petición HTTP GET corregida para limpiar código JS y dejar JSON puro
    async function fetchDataFromGitHub() {
        const token = sessionStorage.getItem('gh_token');
        const owner = sessionStorage.getItem('gh_owner');
        const repo = sessionStorage.getItem('gh_repo');
        
        // CORRECCIÓN 1: Limpiar la ruta por si el usuario pega la URL web completa
        let path = sessionStorage.getItem('gh_path');
        path = path.replace(`https://api.github.com/${owner}/${repo}/blob/main/`, '');
        path = path.replace(`https://api.github.com/${owner}/${repo}/raw/main/`, '');
//                           https://github.com/Pmiay/my.github.io/blob/main/products/miyuro.one.giv
        const url = `https://api.github.com/${owner}/${repo}/contents/${path}`;
alert(url);
        try {
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${token}` }
            });

            if (!response.ok) throw new Error('No se pudo obtener el archivo. Verifica token, repositorio y ruta.');

            const resData = await response.json();
            fileSha = resData.sha;
            
            // Decodificar Base64 de forma segura con UTF-8
            const decodedContent = decodeURIComponent(atob(resData.content).split('').map(c => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            // CORRECCIÓN 2: Sanitizar el archivo ".giv" eliminando "miyuro =" y ";" para extraer el array
            let jsonClean = decodedContent.trim();
            if (jsonClean.startsWith('miyuro')) {
                jsonClean = jsonClean.replace(/^miyuro\s*=\s*/, '');
            }
            if (jsonClean.endsWith(';')) {
                jsonClean = jsonClean.slice(0, -1);
            }
            
            // Reemplazar nombres de propiedades sin comillas por JSON estándar usando Regex
            // Esto repara estructuras del tipo { id: 0, disponible: '...' }
            jsonClean = jsonClean.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":');
            // Cambiar comillas simples por comillas dobles si las hubiera
            jsonClean = jsonClean.replace(/'/g, '"');

            currentData = JSON.parse(jsonClean.trim());
            renderTree(currentData);

        } catch (error) {
            console.error(error);
            alert('Error al procesar el archivo: ' + error.message);
            logoutBtn.click();
        }
    }

    // Petición HTTP PUT corregida para reconstruir el formato original al subir
    async function saveDataToGitHub() {
        const token = sessionStorage.getItem('gh_token');
        const owner = sessionStorage.getItem('gh_owner');
        const repo = sessionStorage.getItem('gh_repo');
        let path = sessionStorage.getItem('gh_path');
        path = path.replace(`https://github.com${owner}/${repo}/blob/main/`, '').replace(`https://github.com${owner}/${repo}/raw/main/`, '');
        
        const url = `https://github.com${owner}/${repo}/contents/${path}`;

        // Reconstruimos la estructura exacta: miyuro = [ ... ] ;
        const jsonString = JSON.stringify(currentData, null, 2);
        const fileContentFinal = `miyuro = ${jsonString} ;\n`;

        // Codificar a Base64 respetando UTF-8
        const base64Content = btoa(encodeURIComponent(fileContentFinal).replace(/%([0-9A-F]{2})/g, (match, p1) => {
            return String.fromCharCode('0x' + p1);
        }));

        const body = {
            message: "Actualización de productos desde el Panel de Control",
            content: base64Content,
            sha: fileSha
        };

        try {
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) throw new Error('Error al intentar guardar en el repositorio.');

            const resData = await response.json();
            fileSha = resData.content.sha;
            alert('¡Los datos se han guardado con éxito preservando el formato miyuro!');
        } catch (error) {
            alert(error.message);
        }
    }


    document.getElementById('btn-save').addEventListener('click', saveDataToGitHub);
            // Parte III
    // Variable para rastrear el producto que se está editando actualmente
    let selectedProductIndex = null;

    // 1. RENDERIZADO DEL ÁRBOL INTERACTIVO DE PRODUCTOS
    function renderTree(data) {
        const container = document.getElementById('tree-container');
        
        // Si el JSON viene dentro de un array o un objeto padre, lo normalizamos
        let products = Array.isArray(data) ? data : (data.products || data.items || []);
        
        if (products.length === 0) {
            container.innerHTML = '<p class="text-gray-400 text-sm italic">No se encontraron productos en el archivo.</p>';
            return;
        }

        // Añadir una barra de búsqueda rápida encima del árbol
        let html = `
            <div class="mb-3">
                <input type="text" id="tree-search" oninput="filterTree(this.value)" placeholder="Buscar producto..." class="w-full px-3 py-1.5 text-xs bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <ul class="space-y-1 text-sm" id="tree-list">
        `;

        products.forEach((prod, index) => {
            const prodCode = prod.producto || prod.code || `ID-${index}`;
            const prodName = prod.nombre || prod.name || 'Producto sin nombre';
            
            html += `
                <li class="tree-item" data-search="${prodCode.toLowerCase()} ${prodName.toLowerCase()}">
                    <button type="button" onclick="selectProduct(${index})" class="w-full text-left px-3 py-2 rounded-md hover:bg-indigo-50 hover:text-indigo-700 transition font-medium flex items-center justify-between text-xs cursor-pointer border border-transparent" id="prod-btn-${index}">
                        <span class="truncate"><strong>[${prodCode}]</strong> ${prodName}</span>
                        <svg class="w-3 h-3 text-gray-400 shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </li>
            `;
        });

        html += '</ul>';
        container.innerHTML = html;
    }

    // Filtrar elementos del árbol dinámicamente en tiempo real
    function filterTree(query) {
        const cleanQuery = query.toLowerCase().trim();
        const items = document.querySelectorAll('#tree-list .tree-item');
        items.forEach(item => {
            const text = item.getAttribute('data-search');
            if (text.includes(cleanQuery)) {
                item.classList.remove('hidden');
            } else {
                item.classList.add('hidden');
            }
        });
    }

    // 2. SELECCIÓN DE PRODUCTO Y GENERACIÓN DE FORMULARIO
    function selectProduct(index) {
        selectedProductIndex = index;
        
        // Resaltar elemento seleccionado en el árbol
        document.querySelectorAll('#tree-list button').forEach(btn => btn.classList.remove('bg-indigo-100', 'text-indigo-800', 'border-indigo-300'));
        const activeBtn = document.getElementById(`prod-btn-${index}`);
        if (activeBtn) activeBtn.classList.add('bg-indigo-100', 'text-indigo-800', 'border-indigo-300');

        let products = Array.isArray(currentData) ? currentData : (currentData.products || currentData.items || []);
        const product = products[index];

        document.getElementById('form-title').innerText = `Editando: ${product.nombre || product.producto}`;
        
        const fieldsContainer = document.getElementById('dynamic-fields');
        fieldsContainer.innerHTML = ''; // Limpiar campos previos

        // Generar campos dinámicamente basados en las propiedades del JSON
        for (const key in product) {
            if (typeof product[key] !== 'object') {
                const labelText = key.charAt(0).toUpperCase() + key.slice(1);
                const isImgField = key.toLowerCase() === 'imagen';
                
                const fieldGroup = document.createElement('div');
                fieldGroup.className = 'space-y-1';
                
                fieldGroup.innerHTML = `
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">${labelText}</label>
                    <input type="text" data-key="${key}" value="${product[key] || ''}" oninput="updateCurrentData(${index}, '${key}', this.value)" class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:bg-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                `;
                fieldsContainer.appendChild(fieldGroup);
            }
        }

        // 3. SECCIÓN DEL CARRUSEL DE IMÁGENES MULTIMEDIA (Repositorio Secundario)
        const productCode = product.producto || '';
        if (productCode) {
            const carouselWrapper = document.createElement('div');
            carouselWrapper.className = 'mt-6 pt-6 border-t border-gray-200';
            
            // Construimos la base de la URL cruda (raw) del repositorio Pmiay/my.github.io para renderizar
            const rawFolderUrl = `https://githubusercontent.com{productCode}`;
            
            carouselWrapper.innerHTML = `
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Galería del Producto (${productCode})</label>
                <p class="text-xs text-gray-400 mb-3">Imágenes vinculadas automáticamente en secuencial (<span class="font-mono">${productCode}.x.png</span>)</p>
                
                <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="relative w-32 h-32 bg-white rounded border border-gray-300 flex items-center justify-center overflow-hidden shrink-0">
                        <img id="carousel-preview" src="${rawFolderUrl}/${productCode}.1.png" onerror="this.src='https://placehold.co'; this.onerror=null;" class="object-contain max-w-full max-h-full">
                    </div>
                    <div class="flex-1 space-y-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-500">Imagen Actual:</span>
                            <span id="carousel-index-indicator" class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded font-mono text-xs">1</span>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" onclick="navigateCarousel('${productCode}', -1)" class="px-3 py-1 bg-white border border-gray-300 text-gray-700 text-xs rounded hover:bg-gray-100 shadow-sm cursor-pointer">◄ Anterior</button>
                            <button type="button" onclick="navigateCarousel('${productCode}', 1)" class="px-3 py-1 bg-white border border-gray-300 text-gray-700 text-xs rounded hover:bg-gray-100 shadow-sm cursor-pointer">Siguiente ►</button>
                        </div>
                        <p class="text-[11px] text-gray-400 italic">Nota: Para añadir o remover imágenes de la galería, manipula directamente los archivos en la carpeta '${productCode}' de tu repositorio 'my.github.io'.</p>
                    </div>
                </div>
            `;
            fieldsContainer.appendChild(carouselWrapper);
        }
    }

    // Control dinámico de la navegación del carrusel simulado
    let currentCarouselIndex = 1;
    function navigateCarousel(productCode, direction) {
        currentCarouselIndex += direction;
        if (currentCarouselIndex < 1) currentCarouselIndex = 1; // Límite inferior
        
        const previewImg = document.getElementById('carousel-preview');
        const indexIndicator = document.getElementById('carousel-index-indicator');
        
        const rawFolderUrl = `https://githubusercontent.com{productCode}`;
        
        indexIndicator.innerText = currentCarouselIndex;
        previewImg.src = `${rawFolderUrl}/${productCode}.${currentCarouselIndex}.png`;
    }

    // Sincronizar cambios en los inputs directamente con la memoria del JSON global
    function updateCurrentData(index, key, value) {
        let products = Array.isArray(currentData) ? currentData : (currentData.products || currentData.items || []);
        products[index][key] = value;
        
        // Si se cambia el nombre o código, refrescar el árbol visual lateral en caliente
        if (key === 'nombre' || key === 'producto') {
            const labelSpan = document.querySelector(`#prod-btn-${index} span`);
            if (labelSpan) {
                const updatedCode = products[index].producto || '---';
                const updatedName = products[index].nombre || 'Sin Nombre';
                labelSpan.innerHTML = `<strong>[${updatedCode}]</strong> ${updatedName}`;
            }
        }
    }
//https://share.google/aimode/oXpJPstpdIRpY9qjT
</script>

</body>
</html>
